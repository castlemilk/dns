name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_engines:
        description: Run the mail integration tests against a throwaway Stalwart container
        type: boolean
        default: false
      deephost_url:
        description: DeepHost control plane URL for the hosting integration tests (empty skips them)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protobuf:
    name: Protobuf lint and generated-code drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.27.0
          cache: true

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Lint protobuf APIs
        run: buf lint

      - name: Regenerate protobuf bindings
        run: buf generate

      - name: Check generated bindings are current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- gen/go apps/web/gen
          generated_status="$(git status --porcelain --untracked-files=all -- gen/go apps/web/gen)"
          if [[ -n "${generated_status}" ]]; then
            printf '%s\n' "${generated_status}"
            printf 'generated protobuf bindings are not current\n' >&2
            exit 1
          fi

      # The drift check above compares whatever buf generated. This asserts the
      # set itself, so a proto package silently dropped from generation fails
      # here instead of at the first missing import.
      - name: Check every protobuf package is generated
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for package in dns deephost platform hosting mail billing activity; do
            if [[ ! -d "gen/go/${package}/v1" ]]; then
              printf 'gen/go/%s/v1 is missing\n' "${package}" >&2
              missing=1
            fi
          done
          for package in dns deephost platform hosting mail billing activity; do
            if [[ ! -d "apps/web/gen/${package}/v1" ]]; then
              printf 'apps/web/gen/%s/v1 is missing\n' "${package}" >&2
              missing=1
            fi
          done
          exit "${missing}"

  go:
    name: Go race tests, vet, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.27.0
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            printf 'Go files are not formatted\n' >&2
            exit 1
          fi

      - name: Run race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint Go
        run: golangci-lint run ./...

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan the checked-out revision for secrets
        run: gitleaks git --redact --no-banner --no-color .

      - name: Build server
        run: go build -buildvcs=false -trimpath ./...

      - name: Verify runtime Go module licenses
        run: >-
          go run ./tools/collect-go-licenses
          -out "${RUNNER_TEMP}/dns-licenses"
          -project-license ./LICENSE
          -target ./cmd/dns

  infrastructure:
    name: OpenTofu and bootstrap validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive
        working-directory: infra/vultr

      - name: Initialize provider plugins without a backend
        run: tofu init -backend=false -lockfile=readonly
        working-directory: infra/vultr

      - name: Validate infrastructure
        run: tofu validate
        working-directory: infra/vultr

      - name: Validate authority bootstrap helper
        run: |
          bash -n bootstrap-authority.sh
          shellcheck bootstrap-authority.sh
        working-directory: infra/vultr

  web:
    name: Web lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0

      - name: Install pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Lint
        run: pnpm lint
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

      - name: Exercise production server telemetry
        run: pnpm test:observability
        working-directory: apps/web

      - name: Verify standalone runtime licenses
        run: pnpm licenses:standalone
        working-directory: apps/web

  chart:
    name: Helm chart lint and render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test operational shell helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/attach-gateway-certificate.sh
          bash -n scripts/backup-snapshot.sh
          bash -n scripts/probe-authorities.sh
          bash -n infra/vultr/bootstrap-authority.sh
          bash -n scripts/tests/attach-gateway-certificate-test.sh
          bash -n scripts/tests/backup-snapshot-test.sh
          bash -n scripts/tests/probe-authorities-test.sh
          bash -n scripts/tests/fake-curl.sh
          bash -n scripts/tests/fake-dig.sh
          for script in scripts/dev/*.sh; do
            [[ -e "${script}" ]] || continue
            bash -n "${script}"
          done
          bash -n scripts/tests/fake-dns-restore.sh
          bash -n scripts/tests/fake-kubectl.sh
          scripts/tests/attach-gateway-certificate-test.sh
          scripts/tests/backup-snapshot-test.sh
          scripts/tests/probe-authorities-test.sh

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Verify observability chart topology
        run: scripts/tests/observability-chart-test.sh

      - name: Lint chart
        run: |
          helm lint --strict charts/dns
          helm lint --strict charts/dns -f charts/dns/ci/production-values.yaml
          helm lint --strict charts/dns -f charts/dns/ci/platform-values.yaml

      - name: Render default chart
        run: helm template dns charts/dns --namespace dns

      - name: Render allowed custom server environment
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/allowed-custom-extra-env.yaml)"
          grep -Fq 'name: GOMEMLIMIT' <<<"${rendered}"
          grep -Fq 'name: GOMAXPROCS' <<<"${rendered}"

      - name: Render production split topology and NodePort DNS path
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml)"
          grep -Fq 'helm.sh/resource-policy: keep' <<<"${rendered}"
          grep -Fq 'paprika.io/prune: "false"' <<<"${rendered}"
          grep -Fq 'whenDeleted: Retain' <<<"${rendered}"
          grep -Fq 'whenScaled: Retain' <<<"${rendered}"

      - name: Render experimental shared LoadBalancer path
        run: >-
          helm template dns charts/dns --namespace dns
          -f charts/dns/ci/production-values.yaml
          --set nodePortService.enabled=false
          --set dnsService.enabled=true
          --set dnsService.acknowledgeVultrSharedHealthCheckRisk=true

      - name: Render bearer-protected UI and Connect route
        run: >-
          helm template dns charts/dns --namespace dns
          -f charts/dns/ci/production-values.yaml
          --set httpRoute.enabled=true
          --set httpRoute.acknowledgePublicControlPlane=true
          --set 'httpRoute.hostnames[0]=dns.example.com'

      - name: Render remote snapshot route, certificate, and ReferenceGrant
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set snapshotRoute.enabled=true \
            --set snapshotRoute.acknowledgePublicSnapshotFeed=true \
            --set snapshotRoute.hostname=snapshot.dns.example.com \
            --set tls.enabled=true \
            --set 'tls.dnsNames[0]=snapshot.dns.example.com')"
          grep -Fq 'type: Exact' <<<"${rendered}"
          grep -Fq 'value: /internal/v1/snapshot' <<<"${rendered}"
          # The platform backup rode on the same route and was never published,
          # which the nightly job reported as "no platform store" rather than as
          # a failure. Assert it so it cannot disappear silently again.
          grep -Fq 'value: /internal/v1/platform-backup' <<<"${rendered}"

      - name: Render the platform store and every engine
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml)"
          # Engine credentials arrive only through secretKeyRef.
          grep -Fq 'name: HOSTING_API_TOKEN' <<<"${rendered}"
          grep -Fq 'name: MAIL_API_TOKEN' <<<"${rendered}"
          grep -Fq 'name: STRIPE_WEBHOOK_SECRET' <<<"${rendered}"
          grep -Fq 'name: DNS_PLATFORM_PATH' <<<"${rendered}"
          grep -Fq 'name: ACTIVITY_MAX_EVENTS' <<<"${rendered}"
          # The web pod reads the plan endpoint through the control Service.
          grep -Fq 'name: DNS_API_URL' <<<"${rendered}"
          # Every Connect service prefix reaches control, not the web UI.
          grep -Fq 'value: /dns.v1.DNSService' <<<"${rendered}"
          grep -Fq 'value: /platform.v1.PlatformService' <<<"${rendered}"
          grep -Fq 'value: /hosting.v1.HostingService' <<<"${rendered}"
          grep -Fq 'value: /mail.v1.MailService' <<<"${rendered}"
          grep -Fq 'value: /billing.v1.BillingService' <<<"${rendered}"
          grep -Fq 'value: /activity.v1.ActivityService' <<<"${rendered}"
          grep -Fq 'value: /billing/v1/stripe/webhook' <<<"${rendered}"
          # Uploads get their own volume and a route timeout above Envoy's 15 s.
          grep -Fq 'mountPath: /uploads' <<<"${rendered}"
          grep -Fq 'request: 10m' <<<"${rendered}"
          # The volume quota tracks maxTotalBytes, not maxBytes: 128 MiB total
          # plus a 64 MiB in-flight folder, doubled for the packed archive.
          grep -Fq 'sizeLimit: 402653184' <<<"${rendered}"
          # No engine token value is ever rendered into a manifest.
          if grep -Eq 'value: "?(sk_|rk_|whsec_|API_)' <<<"${rendered}"; then
            printf 'a credential-shaped literal was rendered into a manifest\n' >&2
            exit 1
          fi

      - name: Assert the default render carries no engine environment
        shell: bash
        run: |
          set -euo pipefail
          rendered="$(helm template dns charts/dns --namespace dns)"
          if grep -Eq 'name: (HOSTING_|MAIL_|STRIPE_|BILLING_)' <<<"${rendered}"; then
            printf 'a disabled engine rendered environment variables\n' >&2
            exit 1
          fi
          grep -Fq 'name: DNS_PLATFORM_PATH' <<<"${rendered}"

      - name: Assert production safety guards fail closed
        shell: bash
        run: |
          set -euo pipefail

          assert_fails() {
            if "$@" >/dev/null 2>&1; then
              printf 'expected command to fail: %q ' "$@" >&2
              printf '\n' >&2
              return 1
            fi
          }

          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set auth.existingSecret=REPLACE_WITH_SECRET
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set 'control.nameservers[0]=ns1.example.com' \
            --set 'control.nameservers[1]=ns2.example.com'
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set httpRoute.enabled=true \
            --set 'httpRoute.hostnames[0]=dns.example.com'
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set dnsService.enabled=true \
            --set dnsService.acknowledgeVultrSharedHealthCheckRisk=true
          assert_fails helm template dns charts/dns --namespace dns \
            --set control.replicaCount=2
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set-string images.server.digest=sha256:REPLACE
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set snapshotRoute.enabled=true \
            --set snapshotRoute.hostname=snapshot.dns.example.com
          assert_fails helm template dns charts/dns --namespace dns \
            --set 'authority.snapshot.url=https://snapshot.example.com/internal/v1/snapshot?query=forbidden'
          assert_fails helm template dns charts/dns --namespace dns \
            --set control.httpMaxBodyBytes=67108865
          assert_fails helm template dns charts/dns --namespace dns \
            --set authority.snapshot.maxBodyBytes=1073741825
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/rejected-control-extra-env.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/rejected-authority-extra-env.yaml

          # The template guard remains authoritative even if a caller opts out
          # of values-schema validation.
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            -f charts/dns/ci/rejected-control-extra-env.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            -f charts/dns/ci/rejected-authority-extra-env.yaml

      - name: Assert platform and engine guards fail closed
        shell: bash
        run: |
          set -euo pipefail

          assert_fails() {
            if "$@" >/dev/null 2>&1; then
              printf 'expected command to fail: %q ' "$@" >&2
              printf '\n' >&2
              return 1
            fi
          }

          # The in-process fake engines are local-development modes; a chart
          # release must never select one.
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.billing.provider=fake
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            --set platform.billing.provider=fake
          # An incomplete engine block would start a control plane that cannot
          # reach its engine, so the chart refuses it before the server does.
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.hosting.enabled=true
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.hosting.enabled=true \
            --set platform.hosting.apiUrl=http://deephost.deephost.svc.cluster.local:8080 \
            --set platform.hosting.existingSecret=dns-hosting
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set platform.hosting.appsTlsSecret=""
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set 'platform.hosting.gatewayAddresses[0]=127.0.0.1'
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.mail.enabled=true \
            --set platform.mail.apiUrl=http://stalwart.mail.svc.cluster.local:8080 \
            --set platform.mail.hostname=mail.example.com
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set platform.mail.apiUrl=http://mail.example.com:8080
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set platform.billing.publicUrl=http://dns.example.com
          # A signature key with no bearer configures a second factor for a
          # receiver that is never mounted, which the server refuses at load.
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set platform.mail.webhookSecretKey="" \
            --set platform.mail.webhookSignatureKeyKey=mail-webhook-signature-key
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.billing.webhookRoute.enabled=true
          # The platform store never shares a file with the zone store.
          assert_fails helm template dns charts/dns --namespace dns \
            --set platform.storePath=/data/dns.db
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            --set platform.storePath=/etc/platform.db
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/rejected-platform-extra-env.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            -f charts/dns/ci/rejected-platform-extra-env.yaml
          # envFrom is the same smuggling route with the names hidden inside an
          # object the chart only references, so the key is refused outright:
          # a configMapRef would hold engine credentials in plaintext, and a
          # secretRef could turn on an engine the guards above never approved.
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/rejected-control-extra-env-from.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            -f charts/dns/ci/rejected-control-extra-env-from.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/rejected-web-extra-env-from.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            --skip-schema-validation \
            -f charts/dns/ci/rejected-web-extra-env-from.yaml
          assert_fails helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/production-values.yaml \
            --set 'authority.extraEnvFrom[0].secretRef.name=smuggled-engine-secret'
          # No component renders an envFrom list at all.
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml)"
          if grep -Fq 'envFrom:' <<<"${rendered}"; then
            printf 'a container rendered an unfiltered envFrom list\n' >&2
            exit 1
          fi

      - name: Assert the uploads volume quota tracks the admission cap
        shell: bash
        run: |
          set -euo pipefail
          # The server admits folders until staged + in-flight approaches
          # maxTotalBytes, so a quota derived from maxBytes alone let kubelet
          # evict the single control pod holding dns.db and platform.db.
          rendered="$(helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set platform.hosting.uploads.maxBytes=1048576 \
            --set platform.hosting.uploads.maxTotalBytes=4294967296)"
          total="$(grep -A1 -F 'name: HOSTING_UPLOAD_MAX_TOTAL_BYTES' <<<"${rendered}" \
            | grep -oE '[0-9]+' | tail -n1)"
          quota="$(grep -oE 'sizeLimit: [0-9]+' <<<"${rendered}" | grep -oE '[0-9]+')"
          if (( quota < total )); then
            printf 'uploads emptyDir quota %s is below the admission cap %s\n' \
              "${quota}" "${total}" >&2
            exit 1
          fi
          # An ephemeral-storage limit under that quota evicts just as surely.
          if helm template dns charts/dns --namespace dns \
            -f charts/dns/ci/platform-values.yaml \
            --set control.resources.limits.ephemeral-storage=128Mi >/dev/null 2>&1; then
            printf 'an ephemeral-storage limit below the uploads quota rendered\n' >&2
            exit 1
          fi

  engines:
    name: Engine integration tests (manual)
    # The integration tests carry no build tag: they compile in the go job and
    # skip themselves when their engine URL is unset. This job is the only
    # place that sets one, and it never runs on a push or a pull request
    # because it starts a real mail server and, optionally, talks to a DeepHost
    # control plane this workflow does not own.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_engines }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: auto
      STALWART_PACKAGE: ci
      STALWART_CONTAINER: simple-stalwart-ci
      STALWART_IMAGE: stalwartlabs/stalwart:v0.16
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.27.0
          cache: true

      # scripts/dev/stalwart-up.sh starts the container, bootstraps it, restarts
      # it (bootstrap mode requires that), mints an API key, and writes
      # <dir>/mail.env with DEEPHOST_TEST_STALWART_URL and _TOKEN. The key is
      # written to a mode-0600 file and never printed, so it stays out of the
      # workflow log. A `services:` container cannot express the restart, which
      # is why the container is managed by name here.
      - name: Start and bootstrap Stalwart
        shell: bash
        run: |
          set -euo pipefail
          scripts/dev/stalwart-up.sh
          test -s "${STALWART_DIR}/mail.env"
        env:
          STALWART_DIR: ${{ runner.temp }}/stalwart

      - name: Run the mail integration tests
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/stalwart/mail.env"
          set +a
          go test -race -count=1 -run Integration ./internal/mail/...

      - name: Run the hosting integration tests
        if: ${{ inputs.deephost_url != '' }}
        env:
          DEEPHOST_TEST_DEEPHOST_URL: ${{ inputs.deephost_url }}
        run: go test -race -count=1 -run Integration ./internal/hosting/...

      - name: Stop Stalwart
        if: always()
        run: docker rm --force "${STALWART_CONTAINER}" >/dev/null 2>&1 || true
