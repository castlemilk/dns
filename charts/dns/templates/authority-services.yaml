apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "authority-headless") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "authority") | nindent 4 }}
  {{- with .Values.authority.headlessService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  # publishNotReadyAddresses is deliberately NOT set. false is the API default,
  # so the server stores nothing, and a GitOps differ comparing this manifest to
  # the live object sees a field that is present here and absent there — forever.
  # That kept this Service permanently OutOfSync, which re-armed self-heal on
  # every cooldown and left the Application reconciling in a loop.
  #
  # The default is also the behaviour we want: an authority pod must not receive
  # DNS traffic through this Service until it is ready, because a pod that has
  # not loaded a snapshot answers REFUSED.
  ports:
    - name: http
      port: {{ .Values.authority.healthService.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dns.selectorLabels" (dict "root" . "component" "authority") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "authority-health") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "authority-health") | nindent 4 }}
  {{- with .Values.authority.healthService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.authority.healthService.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dns.selectorLabels" (dict "root" . "component" "authority") | nindent 4 }}
