apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "control") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "control") | nindent 4 }}
  {{- with .Values.control.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dns.selectorLabels" (dict "root" . "component" "control") | nindent 4 }}
