{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "http-route") | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.parentRef.name is required when httpRoute.enabled=true" .Values.httpRoute.parentRef.name }}
      {{- with .Values.httpRoute.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- /*
  httpRoute.hostnames when it has entries, else <domain.service>.<domain.base>.
  Asking dns.httpRouteHostnames rather than reading the value is what lets a
  zone move be one edit; with domain.base empty the helper hands back the value
  verbatim, so this renders exactly as it always has. The list is only ever
  empty when neither is set, which dns.validate refuses for an enabled route —
  the `with` guard stays anyway so a bare `hostnames:` key can never be emitted,
  which the Gateway API would read as "match every host".
  */}}
  {{- with (include "dns.httpRouteHostnames" . | fromYamlArray) }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (include "dns.apiPathPrefixes" . | fromYamlArray) }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "dns.resourceName" (dict "root" $ "suffix" "control") }}
          port: {{ $.Values.control.service.port }}
          weight: 1
    {{- end }}
    {{- if and .Values.platform.hosting.enabled .Values.platform.hosting.uploads.enabled }}
    # A folder upload streams for far longer than Envoy's 15 s default route
    # timeout, so this one prefix gets its own bound. The handler still applies
    # its own body cap and read deadline.
    - matches:
        - path:
            type: PathPrefix
            value: /hosting/v1/uploads
      timeouts:
        request: 10m
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "dns.resourceName" (dict "root" . "suffix" "control") }}
          port: {{ .Values.control.service.port }}
          weight: 1
    {{- end }}
    {{- if .Values.platform.billing.webhookRoute.enabled }}
    # Exactly one unauthenticated path. It is signature-verified, body-capped,
    # and rejects any request carrying an Origin header.
    - matches:
        - path:
            type: Exact
            value: /billing/v1/stripe/webhook
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "dns.resourceName" (dict "root" . "suffix" "control") }}
          port: {{ .Values.control.service.port }}
          weight: 1
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "dns.resourceName" (dict "root" . "suffix" "web") }}
          port: {{ .Values.web.service.port }}
          weight: 1
{{- end }}
