{{- if .Values.externalIPService.enabled }}
# Authoritative DNS published directly on node addresses.
#
# A Vultr load balancer cannot carry TCP/53 and UDP/53 at once: its API refuses
# a second forwarding rule on a frontend port already in use, so neither the
# shared gateway LB nor a dedicated one can serve DNS. hostPort would work but
# is forbidden by both the baseline and restricted Pod Security levels, which
# this namespace enforces. Publishing the node addresses on a ClusterIP Service
# keeps the pods restricted, needs no load balancer, and gives each nameserver
# its own address on its own node.
#
# Each address must already route to a node of this cluster. kube-proxy accepts
# traffic for them on every node, so a query that lands anywhere is forwarded to
# a ready authority pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "authoritative-external") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "authoritative-dns") | nindent 4 }}
  {{- with .Values.externalIPService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  externalIPs:
    {{- toYaml .Values.externalIPService.addresses | nindent 4 }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
  selector:
    {{- include "dns.selectorLabels" (dict "root" . "component" "authority") | nindent 4 }}
{{- end }}
