{{- if .Values.snapshotRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "snapshot") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "snapshot-route") | nindent 4 }}
  {{- with .Values.snapshotRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.snapshotRoute.parentRef.name }}
      namespace: {{ .Values.snapshotRoute.parentRef.namespace }}
      sectionName: {{ .Values.snapshotRoute.parentRef.sectionName }}
  {{- /*
  snapshotRoute.hostname when set, else snapshot.<domain.service>.<domain.base>.
  Exactly one name, as before: this route carries one authenticated path for
  remote authority fleets and nothing else, and a second hostname on it would
  be a second way in. dns.validate refuses an enabled route with no name, so
  the helper is never empty here.
  */}}
  hostnames:
    - {{ include "dns.snapshotHost" . | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /internal/v1/snapshot
        {{- /*
        The platform backup has to be published beside the snapshot feed.
        internal/app/app.go mounts GET /internal/v1/platform-backup behind the
        same snapshot bearer, but nothing routed it, so the request died at the
        Gateway with a bare 404 — indistinguishable from a path that does not
        exist. scripts/backup-snapshot.sh reads that 404 as "this deployment has
        no platform store" and reports success, so the nightly job went green
        every night while backing up zones only. platform.db holds the hosting
        sites, deploys, mailboxes and the Stripe subscription mappings for a
        live product; none of it was in the archive, and the first time anyone
        would have found out is a restore.
        Same host, same bearer, so this adds no unauthenticated surface.
        */}}
        - path:
            type: Exact
            value: /internal/v1/platform-backup
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "dns.resourceName" (dict "root" . "suffix" "control") }}
          port: {{ .Values.control.service.port }}
          weight: 1
{{- end }}
