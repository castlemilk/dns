{{- if .Values.observability.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "otel-collector") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
data:
  relay.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        check_collector_pipeline:
          enabled: true
          interval: 5s
          exporter_failure_threshold: 5

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: {{ .Values.observability.collector.receiver.maxRecvMsgSizeMiB }}
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: {{ printf "%d" (int64 .Values.observability.collector.receiver.maxRequestBodyBytes) }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.observability.collector.memoryLimiter.checkInterval }}
        limit_mib: {{ .Values.observability.collector.memoryLimiter.limitMiB }}
        spike_limit_mib: {{ .Values.observability.collector.memoryLimiter.spikeLimitMiB }}
      batch:
        timeout: {{ .Values.observability.collector.batch.timeout }}
        send_batch_size: {{ .Values.observability.collector.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.observability.collector.batch.sendBatchMaxSize }}

    connectors:
      span_metrics:
        namespace: deephost.trace
        histogram:
          unit: s
          explicit:
            buckets: [1ms, 2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.request.method
          - name: http.response.status_code
          - name: rpc.method
        exclude_dimensions:
          - span.name
        exemplars:
          enabled: true
          max_per_data_point: 5
        aggregation_cardinality_limit: 1000
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        metrics_flush_interval: 15s
        series_expiration: 10m
        resource_metrics_cache_size: 1000
        resource_metrics_key_attributes:
          - service.name
          - service.namespace
          - telemetry.sdk.language
          - telemetry.sdk.name

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true
        send_timestamps: false
        metric_expiration: {{ .Values.observability.collector.prometheus.metricExpiration }}
        resource_to_telemetry_conversion:
          enabled: true

    service:
      extensions: [health_check]
      telemetry:
        resource:
          attributes:
            - name: service.name
              value: deephost-otel-collector
            - name: service.namespace
              value: {{ .Release.Namespace }}
            - name: service.version
              value: {{ .Chart.AppVersion | quote }}
            - name: k8s.namespace.name
              value: {{ .Release.Namespace }}
        logs:
          level: info
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    # Keep collector self-metric names stable across Prometheus
                    # SDK suffix policy changes; application metrics still use
                    # normal Prometheus counter/unit suffixes on port 8889.
                    without_type_suffix: true
                    without_units: true
                    with_resource_constant_labels:
                      included:
                        - service.name
                        - service.namespace
                        - service.version
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [span_metrics]
        metrics:
          receivers: [otlp, span_metrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
{{- end }}
