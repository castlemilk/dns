apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns.resourceName" (dict "root" . "suffix" "web") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dns.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "dns.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "dns.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.web.topologySpread.maxSkew }}
          topologyKey: {{ .Values.web.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.web.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "dns.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      containers:
        - name: web
          image: {{ include "dns.image" .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.web.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.web.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.web.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          env:
            # Server-side only: the landing page reads GET /public/v1/plan
            # through the cluster Service. It is never sent to the browser and
            # web.extraEnv already refuses DNS_* shadowing.
            - name: DNS_API_URL
              value: {{ include "dns.controlURL" . | quote }}
            {{- if .Values.observability.enabled }}
            {{- include "dns.otelEnv" (dict "root" . "component" "web") | nindent 12 }}
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next.js writes its fetch cache here when it regenerates the
            # prerendered landing page. The root filesystem is read-only, so
            # without somewhere to write it logs against .next/cache on every
            # regeneration. The standalone output ships no .next/cache, so this
            # mount masks nothing.
            #
            # It does NOT silence regeneration entirely. Next also rewrites the
            # prerendered HTML at .next/server/app/index.html, which stays
            # read-only and logs one EROFS per regeneration. That path cannot be
            # mounted over — .next/server holds the compiled application, and an
            # emptyDir there would hide it. The line is expected and harmless:
            # the page is still regenerated and served correctly from the
            # in-memory cache, as the live deployment shows. Silencing it needs
            # a custom next.config `cacheHandler` writing outside /app.
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
