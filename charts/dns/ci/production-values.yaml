# Render-only fixture, and the DERIVED half of the domain pair: like the real
# deployment in deploy/paprika/application.yaml it names one zone and empties
# control.nameservers, so the delegation falls out of domain.base instead of
# being written by hand. ci/platform-values.yaml is the other half — domain.base
# set while every hostname stays explicit — so between them the chart job covers
# both rules: derive when empty, never override when set.
#
# Only the nameservers derive HERE, because httpRoute, snapshotRoute and tls
# stay off in this file: the ci.yml steps that turn them on also pass their own
# --set hostnames, and two of those steps assert the chart REFUSES a public
# route with no acknowledgement, which enabling them here would defeat. The
# other five derived names are covered by rendering the values extracted from
# deploy/paprika/application.yaml.
#
# The deterministic image digests and Secret name must never be used for a live
# release. The zone matches the intended production one so that the production
# guard, which refuses placeholder and RFC 2606 nameserver names, exercises its
# success path against DERIVED names rather than hand-written ones.
production: true
domain:
  base: benebsworth.com
  # Mirrors deploy/paprika/application.yaml, which pins the label rather than
  # inheriting the chart's "dns" default. Kept in step so this fixture keeps
  # exercising the shape production actually renders.
  service: deephost
images:
  server:
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  web:
    tag: ""
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
auth:
  existingSecret: dns-auth-render-test
control:
  httpMaxBodyBytes: 8388608
  # Empty, not deleted: the chart's default for this key is two example.net
  # placeholders which would win over the derivation and then be rejected by
  # the production guard. [] is how derivation is requested, and it is what
  # deploy/paprika/application.yaml carries. Renders ns1.deephost.benebsworth.com
  # and ns2.deephost.benebsworth.com.
  nameservers: []
  persistence:
    storageClass: vultr-block-storage-retain
authority:
  snapshot:
    maxStaleness: 24h
    maxBodyBytes: 8388608
  cache:
    persistence:
      storageClass: vultr-block-storage-retain
observability:
  enabled: true
  environment: production
  collector:
    enabled: true
    serviceMonitor:
      enabled: true
    networkPolicy:
      enabled: true
      monitoringNamespaceSelector:
        kubernetes.io/metadata.name: deephost
      monitoringPodSelector:
        app: deephost-prometheus
  alerts:
    enabled: true
nodePortService:
  enabled: true
