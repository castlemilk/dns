# Render-only fixture. The deterministic image digests and Secret name must
# never be used for a live release; nameserver strings mirror the intended
# production names solely so the production guard exercises its success path.
production: true
images:
  server:
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  web:
    tag: ""
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
auth:
  existingSecret: dns-auth-render-test
control:
  httpMaxBodyBytes: 8388608
  nameservers:
    - ns1.dns.benebsworth.com
    - ns2.dns.benebsworth.com
  persistence:
    storageClass: vultr-block-storage-retain
authority:
  snapshot:
    maxStaleness: 24h
    maxBodyBytes: 8388608
  cache:
    persistence:
      storageClass: vultr-block-storage-retain
observability:
  enabled: true
  environment: production
  collector:
    enabled: true
    serviceMonitor:
      enabled: true
    networkPolicy:
      enabled: true
      monitoringNamespaceSelector:
        kubernetes.io/metadata.name: deephost
      monitoringPodSelector:
        app: deephost-prometheus
  alerts:
    enabled: true
nodePortService:
  enabled: true
