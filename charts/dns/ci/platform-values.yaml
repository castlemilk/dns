# Render-only fixture. It is the production topology with every engine turned
# on, so the chart job proves that the platform environment, the engine
# secretKeyRefs, the upload volume, and the extra HTTPRoute rules all render
# together. Every digest, hostname, address, and Secret name here is a
# placeholder and must never be used for a live release.
#
# It is also the EXPLICIT-WINS half of the domain pair. ci/production-values.yaml
# sets domain.base and empties the hostname values, so it covers derivation.
# This file sets domain.base AND spells out control.nameservers,
# httpRoute.hostnames, platform.mail.hostname and platform.billing.publicUrl,
# which is the harder case: a helper that ever treated the derived name as an
# override rather than a default would change this render, and CI would say so.
# Deriving fills an empty value; it never replaces one. Do not empty the
# hostnames below to "modernise" this file — that is the coverage.
production: true
domain:
  # Set on purpose while every hostname below stays explicit. See the header.
  base: benebsworth.com
images:
  server:
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  web:
    tag: ""
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
auth:
  existingSecret: dns-auth-render-test
control:
  httpMaxBodyBytes: 8388608
  nameservers:
    - ns1.dns.benebsworth.com
    - ns2.dns.benebsworth.com
  persistence:
    storageClass: vultr-block-storage-retain
authority:
  snapshot:
    maxStaleness: 24h
    maxBodyBytes: 8388608
  cache:
    persistence:
      storageClass: vultr-block-storage-retain
platform:
  storePath: /data/platform.db
  activity:
    maxEvents: 50000
  hosting:
    enabled: true
    # Cluster-local Service address: allowed in production without TLS because
    # the request never leaves the cluster network.
    apiUrl: http://deephost-controlplane.deephost.svc.cluster.local:8080
    tenant: simple
    # DeepHost's own ingress and its own wildcard suffix. Neither derives from
    # domain.base — they name another system that only shares this zone by
    # coincidence — so both stay spelled out here even though base is set.
    gatewayHostname: deephost.benebsworth.com
    gatewayAddresses:
      - 203.0.113.10
    gatewayAllowedCidrs:
      - 203.0.113.0/24
    appsSuffix: apps.deephost.benebsworth.com
    appsTlsSecret: dh-wildcard-apps-render-test-tls
    buildDeadline: 40m
    uploads:
      enabled: true
      maxBytes: 67108864
      maxTotalBytes: 134217728
    existingSecret: dns-hosting-render-test
  mail:
    enabled: true
    apiUrl: http://stalwart.mail.svc.cluster.local:8080
    hostname: mail.dns.benebsworth.com
    mxPriority: 10
    spfInclude: spf.dns.benebsworth.com
    dmarcPolicy: quarantine
    reportAddress: dmarc@dns.benebsworth.com
    mailboxesPerDomain: 5
    defaultQuotaBytes: 5368709120
    existingSecret: dns-mail-render-test
  billing:
    provider: stripe
    publicUrl: https://dns.benebsworth.com
    customerEmail: billing@dns.benebsworth.com
    existingSecret: dns-billing-render-test
    webhookRoute:
      enabled: true
observability:
  enabled: true
  environment: production
  collector:
    enabled: true
    serviceMonitor:
      enabled: true
    networkPolicy:
      enabled: true
      monitoringNamespaceSelector:
        kubernetes.io/metadata.name: deephost
      monitoringPodSelector:
        app: deephost-prometheus
  alerts:
    enabled: true
nodePortService:
  enabled: true
httpRoute:
  enabled: true
  acknowledgePublicControlPlane: true
  hostnames:
    - dns.benebsworth.com
