# Shared metadata and immutable image references.
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
imagePullSecrets: []
revisionHistoryLimit: 3
production: false

images:
  server:
    repository: ghcr.io/castlemilk/dns
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/castlemilk/dns-web
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent

# The chart never creates this Secret. Both keys must contain independently
# generated bearer tokens. Control reads both; authorities read only the
# snapshot token.
auth:
  existingSecret: dns-auth
  apiBearerTokenKey: api-bearer-token
  snapshotBearerTokenKey: snapshot-bearer-token

# Single-writer control plane: Connect API, bbolt state, and the authenticated
# internal snapshot feed. The chart rejects more than one replica.
control:
  replicaCount: 1
  nameservers:
    - ns1.example.net
    - ns2.example.net
  # Custom variables only. The chart owns DNS_*, OTEL_*, HOSTING_*, MAIL_*,
  # STRIPE_*, BILLING_*, ACTIVITY_*, POD_NAMESPACE, and POD_NAME runtime
  # settings and rejects attempts to shadow them here. There is deliberately no
  # extraEnvFrom: the chart cannot read the keys inside a referenced Secret or
  # ConfigMap, so an envFrom list is a name filter the chart cannot enforce.
  # Read a value out of a Secret with an extraEnv entry and a secretKeyRef.
  extraEnv: []
  service:
    annotations: {}
    port: 8080
  persistence:
    enabled: true
    existingClaim: ""
    annotations: {}
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
  httpMaxBodyBytes: 1048576
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 1
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 3
    periodSeconds: 20
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Independently scalable, read-only authoritative data plane. Each pod polls an
# authenticated snapshot and keeps a checksum-validated on-disk cache.
authority:
  replicaCount: 3
  # Custom variables only. The chart owns DNS_*, OTEL_*, HOSTING_*, MAIL_*,
  # STRIPE_*, BILLING_*, ACTIVITY_*, POD_NAMESPACE, and POD_NAME runtime
  # settings and rejects attempts to shadow them here. There is deliberately no
  # extraEnvFrom: the chart cannot read the keys inside a referenced Secret or
  # ConfigMap, so an envFrom list is a name filter the chart cannot enforce.
  # Read a value out of a Secret with an extraEnv entry and a secretKeyRef.
  extraEnv: []
  snapshot:
    url: ""
    pollInterval: 5s
    maxStaleness: 1m
    httpTimeout: 5s
    # Aggregate encoded snapshot admission and download limit. The same value
    # is injected into control, so oversized mutations fail atomically before
    # authorities can observe them.
    maxBodyBytes: 8388608
    cachePath: /cache/snapshot.json
  healthService:
    annotations: {}
    port: 8080
  headlessService:
    annotations: {}
  cache:
    persistence:
      enabled: true
      annotations: {}
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      storageClass: ""
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  podAntiAffinity:
    required: true
    topologyKey: kubernetes.io/hostname
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 60
    periodSeconds: 2
    timeoutSeconds: 1
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 3
    periodSeconds: 20
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 2
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  affinity: {}
  tolerations: []

web:
  replicaCount: 1
  # Custom variables only. The chart owns DNS_*, OTEL_*, HOSTING_*, MAIL_*,
  # STRIPE_*, BILLING_*, ACTIVITY_*, POD_NAMESPACE, and POD_NAME runtime
  # settings and rejects attempts to shadow them here. There is deliberately no
  # extraEnvFrom: the chart cannot read the keys inside a referenced Secret or
  # ConfigMap, so an envFrom list is a name filter the chart cannot enforce.
  # Read a value out of a Secret with an extraEnv entry and a secretKeyRef.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    annotations: {}
    port: 3000
  startupProbe:
    httpGet:
      path: /api/health
      port: http
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 1
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    failureThreshold: 3
    periodSeconds: 20
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2
  terminationGracePeriodSeconds: 15
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Platform state and the optional engines behind it. Every engine is off by
# default: the control plane still mounts its service, reports
# configured=false with the missing variable names, and refuses every
# mutation. Engine credentials are never rendered by this chart; each enabled
# engine names an existing Secret whose keys are mounted with secretKeyRef.
platform:
  # Second bbolt file on the control PVC holding sites, mail bindings,
  # subscriptions, the webhook queue and the activity log. It must live under
  # /data and must not be the zone store.
  storePath: /data/platform.db
  activity:
    # Activity ring size. The janitor trims oldest first.
    maxEvents: 50000
  hosting:
    enabled: false
    # DeepHost control plane, e.g.
    # https://deephost-controlplane.deephost.svc.cluster.local:8080. In
    # production it must be HTTPS or a cluster-local Service address.
    apiUrl: ""
    # Tenant every app is created under; at most 24 characters so
    # slug(tenant)-<app> fits DeepHost's 63-character app identity.
    tenant: simple
    # Where an attached apex points. Set the hostname, the addresses, or both;
    # the resolved set is unioned with the static one.
    gatewayHostname: ""
    gatewayAddresses: []
    # Optional guard rails on the resolved set.
    gatewayAllowedCidrs: []
    gatewayResolver: ""
    # Platform wildcard for the automatic <app_ref>.<suffix> host and the
    # Secret holding its certificate. The Secret is required with the suffix.
    appsSuffix: ""
    appsTlsSecret: ""
    buildDeadline: 40m
    # Folder uploads land in a dedicated emptyDir, never on the DNS volume. Its
    # sizeLimit is derived from both bounds below —
    # 2 * (maxTotalBytes + maxBytes), covering the in-flight folder and the
    # packed archive the deployer writes beside it — so raising maxTotalBytes
    # grows the quota instead of leaving the control pod to be evicted.
    uploads:
      enabled: false
      maxBytes: 67108864
      maxTotalBytes: 134217728
    # Existing Secret holding the DeepHost bearer token.
    existingSecret: ""
    apiTokenKey: hosting-api-token
  mail:
    enabled: false
    # Stalwart management API, e.g.
    # http://stalwart.mail.svc.cluster.local:8080. In production it must be
    # HTTPS or a cluster-local Service address: the key travels as a bearer.
    apiUrl: ""
    hostname: ""
    mxPriority: 10
    spfInclude: ""
    dmarcPolicy: quarantine
    reportAddress: ""
    mailboxesPerDomain: 5
    defaultQuotaBytes: 5368709120
    # Existing Secret holding the Stalwart API key, and optionally the shared
    # secret that authenticates the mail server's delivery-event webhook.
    existingSecret: ""
    apiTokenKey: mail-api-token
    # "" leaves the delivery-event receiver unmounted, and the console keeps
    # saying delivery counts are not available. Setting it mounts
    # POST /mail/v1/delivery-events; the value must be the mail server's webhook
    # bearer token. See docs/mail-runbook.md, "Delivery statistics".
    webhookSecretKey: ""
    # The mail server's signatureKey, which is a setting of its own there. ""
    # means this deployment uses the one value above for both, so X-Signature is
    # keyed with the bearer and adds nothing to it; a second key here makes the
    # signature a real second factor and an unsigned delivery is then refused.
    # Requires webhookSecretKey.
    webhookSignatureKeyKey: ""
  billing:
    # "" disables billing. Only the real Stripe provider is deployable; the
    # in-process fake is a local-development mode the chart refuses.
    provider: ""
    publicUrl: ""
    customerEmail: ""
    # Existing Secret holding the Stripe credentials. The webhook key may hold
    # a comma-separated list of up to three whsec_ secrets during a rotation.
    existingSecret: ""
    secretKeyKey: stripe-secret-key
    webhookSecretKey: stripe-webhook-secret
    priceIdKey: stripe-price-id
    # Exact HTTPRoute rule for the unauthenticated, signature-verified
    # /billing/v1/stripe/webhook path. It requires httpRoute.enabled.
    webhookRoute:
      enabled: false

# OpenTelemetry is the single instrumentation egress path for every
# application component. When the in-cluster collector is enabled, an empty
# endpoint resolves to its stable Service; otherwise an explicit endpoint is
# required. No authentication material belongs in these values.
observability:
  enabled: false
  # Paprika renders manifests in a stub environment that reports no CRDs, so the
  # ServiceMonitor and PrometheusRule capability probes are always false there.
  # Set this when the target cluster is known to have the Prometheus operator
  # CRDs installed and those objects should be rendered regardless.
  assumeMonitoringCRDs: false
  environment: development
  otlp:
    endpoint: ""
    protocol: http/protobuf
    compression: gzip
    metricExportIntervalMilliseconds: 15000
    metricExportTimeoutMilliseconds: 10000
    traceSampleRatio: 0.1
  collector:
    enabled: false
    replicaCount: 2
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.159.0"
      digest: sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
      pullPolicy: IfNotPresent
    service:
      annotations: {}
    # These annotations are retained as a portable scrape fallback. The VKE
    # Prometheus discovers every dns-otel-metrics headless endpoint on ports
    # 8889 and 8888 rather than scraping the load-balanced OTLP Service.
    prometheusAnnotations:
      enabled: true
    prometheus:
      # Retire the old collector's last values soon after an SDK reconnects to
      # another replica, avoiding prolonged duplicate gauge series.
      metricExpiration: 1m
    serviceMonitor:
      enabled: false
      additionalLabels: {}
      interval: 30s
      scrapeTimeout: 10s
    networkPolicy:
      enabled: false
      monitoringNamespaceSelector: {}
      monitoringPodSelector: {}
    receiver:
      maxRequestBodyBytes: 8388608
      maxRecvMsgSizeMiB: 8
    memoryLimiter:
      checkInterval: 1s
      limitMiB: 192
      spikeLimitMiB: 48
    batch:
      timeout: 5s
      sendBatchSize: 2048
      sendBatchMaxSize: 4096
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    podAnnotations: {}
    podLabels: {}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    startupProbe:
      httpGet:
        path: /
        port: health
      failureThreshold: 30
      periodSeconds: 2
      timeoutSeconds: 1
    livenessProbe:
      httpGet:
        path: /
        port: health
      failureThreshold: 3
      periodSeconds: 20
      timeoutSeconds: 2
    readinessProbe:
      httpGet:
        path: /
        port: health
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 2
    terminationGracePeriodSeconds: 30
    topologySpread:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    nodeSelector: {}
    affinity: {}
    tolerations: []
  alerts:
    enabled: false
    additionalLabels: {}
    evaluationWindow: 5m
    for: 10m
    authorityStaleSeconds: 300
    dnsServfailRatio: 0.01

# Preferred backend for a CCM-unmanaged Vultr Load Balancer.
nodePortService:
  enabled: false
  annotations: {}
  nodePort: 30053
  externalTrafficPolicy: Cluster

# Experimental shared Vultr CCM endpoint.
dnsService:
  enabled: false
  acknowledgeVultrSharedHealthCheckRisk: false
  sharedLoadBalancerLabel: ""
  udp:
    annotations: {}
    loadBalancerClass: ""
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []
  tcp:
    annotations: {}
    loadBalancerClass: ""
    loadBalancerIP: ""
    externalTrafficPolicy: Cluster
    loadBalancerSourceRanges: []

# Browser Connect calls use the control Service and therefore still require the
# control bearer token. The snapshot endpoint is deliberately not routed.
# No NetworkPolicy is rendered: live Paprika health checks originate in
# paprika-e2e, Gateway traffic originates in envoy-gateway-system, and the
# provider LB backend source is not declared by this chart. Add deny-by-default
# policies only after those exact selectors/CIDRs are known and canaried.
httpRoute:
  enabled: false
  acknowledgePublicControlPlane: false
  annotations: {}
  parentRef:
    name: paprika
    namespace: envoy-gateway-system
    sectionName: https
  hostnames: []
  apiPathPrefix: /dns.v1.DNSService

# Optional narrow route for remote authority fleets. It exposes only the fixed
# authenticated snapshot endpoint, never the Connect API or UI.
snapshotRoute:
  enabled: false
  acknowledgePublicSnapshotFeed: false
  annotations: {}
  parentRef:
    name: paprika
    namespace: envoy-gateway-system
    sectionName: https
  hostname: ""

# Optional certificate and cross-namespace grant. The shared Gateway must still
# be updated by its platform owner to reference tls.secretName; this chart does
# not mutate the Gateway.
tls:
  enabled: false
  clusterIssuer: letsencrypt-prod-dns
  secretName: dns-tls
  dnsNames: []
  referenceGrant:
    enabled: true
    gatewayNamespace: envoy-gateway-system

# Authoritative DNS published on node addresses. A Vultr load balancer cannot
# carry TCP/53 and UDP/53 at once (its API refuses a second forwarding rule on
# a frontend port already in use), and hostPort is forbidden by the baseline and
# restricted Pod Security levels, so this is the path that serves both protocols
# without a load balancer and without relaxing pod security. Every address must
# already route to a node of this cluster; use one per nameserver hostname.
externalIPService:
  enabled: false
  addresses: []
  annotations: {}
