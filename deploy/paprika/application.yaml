# Bootstrap once with:
#   kubectl apply -f deploy/paprika/application.yaml
#
# BLOCKED BY DESIGN: replace the git revision and both sha256 image digests
# before applying. The placeholder digests fail the chart schema, so Paprika
# cannot deploy mutable or guessed images. The dns-auth Secret must already
# contain independent api-bearer-token and snapshot-bearer-token keys; never
# add token data here.
apiVersion: v1
kind: Namespace
metadata:
  name: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: core.paprika.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
spec:
  description: DNS workloads from the castlemilk/dns repository
  sourceRepos:
    - https://github.com/castlemilk/dns.git
  destinations:
    - server: "*"
      namespace: dns
  kinds:
    - ConfigMap
    - Deployment
    - StatefulSet
    - Service
    - PersistentVolumeClaim
    - PodDisruptionBudget
    - NetworkPolicy
    - HTTPRoute
    - Certificate
    - ReferenceGrant
    # Paprika resolves these CRD GVKs through API discovery using the apiVersion
    # rendered by the chart; the project allow-list itself is kind-based.
    - ServiceMonitor
    - PrometheusRule
---
apiVersion: pipelines.paprika.io/v1alpha1
kind: Application
metadata:
  name: dns
  namespace: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
spec:
  project: default
  parameters:
    # Paprika otherwise injects dns-release, which would change every rendered
    # Service name and break the stable in-cluster health-check URL below.
    release-name: dns
  source:
    type: git
    repoUrl: https://github.com/castlemilk/dns.git
    # Replace with the full 40-character commit SHA containing the chart and
    # exactly matching the image provenance labels/digests below.
    revision: REPLACE_WITH_FULL_40_CHARACTER_GIT_SHA
    path: charts/dns
    targetNamespace: dns
    pollInterval: 60s
    valuesFile: |
      production: true
      images:
        server:
          tag: ""
          digest: sha256:REPLACE_WITH_64_HEX_SERVER_DIGEST
        web:
          tag: ""
          digest: sha256:REPLACE_WITH_64_HEX_WEB_DIGEST
      auth:
        existingSecret: dns-auth
        apiBearerTokenKey: api-bearer-token
        snapshotBearerTokenKey: snapshot-bearer-token
      # The hosting engine. extraEnv deliberately cannot carry HOSTING_* — the
      # chart schema forbids that prefix so engine configuration goes through
      # this typed block instead, where the values are validated. The token is a
      # Secret reference and never a literal: create dns-hosting-engine in the
      # dns namespace with an api-token key holding a DeepHost control-plane
      # token, exactly as the dns-auth Secret is created out of band. With
      # enabled false the facade reports hosting as not configured and the
      # console degrades to DNS only, which is the honest default.
      platform:
        # Mail is staged but OFF, and turning it on needs two things this
        # cluster does not have yet:
        #   1. Block storage. The account is at its Vultr subscription limit —
        #      dns-authority-1 and -2 have been Pending on exactly that — and the
        #      mail StatefulSet claims a volume, so it would land the same way.
        #   2. A dns-mail-engine Secret holding the admin token, created out of
        #      band like dns-auth. The chart refuses to render without it rather
        #      than emitting an empty Secret reference.
        # Beyond the cluster: outbound 25 is blocked by many providers, the MX
        # records must delegate to the published node addresses, and submission
        # and POP3S need a certificate before either listener starts.
        mail:
          enabled: false
        hosting:
          enabled: true
          apiUrl: http://deephost-controlplane.deephost.svc.cluster.local:8080
          gatewayHostname: apps.deephost.benebsworth.com
          existingSecret: dns-hosting-engine
          apiTokenKey: api-token
      control:
        # Permit zone-file imports up to the aggregate publication ceiling.
        httpMaxBodyBytes: 8388608
        nameservers:
          - ns1.dns.benebsworth.com
          - ns2.dns.benebsworth.com
        persistence:
          # The cluster default deletes its Vultr volume when the PVC is
          # removed. Retain protects the backing volume from Paprika pruning.
          storageClass: vultr-block-storage-retain
      authority:
        replicaCount: 3
        snapshot:
          pollInterval: 5s
          # Keep the last checksum-valid snapshot serving through a control
          # outage; readiness degrades only after a full day without refresh.
          maxStaleness: 24h
          httpTimeout: 5s
          # Bounds control admission and authority download/compile together.
          # Raise only after heap benchmarks and resource limits are reviewed.
          maxBodyBytes: 8388608
        cache:
          # Ephemeral snapshot cache, on purpose. The Vultr account is at its
          # block-storage SUBSCRIPTION cap (a count limit, 10 of 10), and the
          # third authority's 1Gi claim sat Pending behind it for two days.
          # Three 1Gi caches were consuming three of the ten slots to hold a
          # file that is a recovery copy, not serving state.
          #
          # What this gives up: a restarted authority can no longer serve from
          # its own last-known snapshot while the control plane is unreachable;
          # it must reach control first. Nothing on the query path changes — a
          # query reads an in-memory pointer and never touches the cache file.
          # Bounded by three replicas behind a minAvailable=2 PDB, which do not
          # restart together. Revert both lines once the cap is raised.
          acknowledgeEphemeralCache: true
          persistence:
            enabled: false
            storageClass: vultr-block-storage-retain
      observability:
        enabled: true
        environment: production
        collector:
          enabled: true
          # The immutable upstream multi-architecture 0.159.0 image index.
          image:
            tag: "0.159.0"
            digest: sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          serviceMonitor:
            # Kept for operator-compatible Prometheus installations. The
            # current deephost Prometheus uses endpoint-aware static discovery.
            enabled: true
          networkPolicy:
            enabled: true
            monitoringNamespaceSelector:
              kubernetes.io/metadata.name: deephost
            monitoringPodSelector:
              app: deephost-prometheus
        alerts:
          enabled: true
      httpRoute:
        enabled: true
        acknowledgePublicControlPlane: true
        parentRef:
          name: paprika
          namespace: envoy-gateway-system
          sectionName: https
        hostnames:
          - dns.benebsworth.com
      dnsService:
        # Prefer an out-of-band LB with UDP+TCP rules on one stable address.
        enabled: false
        acknowledgeVultrSharedHealthCheckRisk: false
        # Both protocol Services share this Vultr LB label. Empty derives a
        # release-qualified label; on VKE, set an existing LB label to reuse
        # its stable address.
        sharedLoadBalancerLabel: ""
        udp:
          # Portable address hint; support depends on the Vultr CCM release.
          loadBalancerIP: ""
        tcp:
          # Keep this identical to UDP when the CCM honors address hints.
          loadBalancerIP: ""
      snapshotRoute:
        # This exact-path route still requires the distinct snapshot bearer
        # token; no Connect procedure or UI path is exposed on this hostname.
        enabled: true
        acknowledgePublicSnapshotFeed: true
        hostname: snapshot.dns.benebsworth.com
      tls:
        enabled: true
        clusterIssuer: letsencrypt-prod-dns
        secretName: dns-tls
        dnsNames:
          - dns.benebsworth.com
          - snapshot.dns.benebsworth.com
        referenceGrant:
          enabled: true
          gatewayNamespace: envoy-gateway-system
      # The nameservers the delegation actually points at. A Vultr load balancer
      # cannot carry TCP and UDP 53 together (its API refuses a second
      # forwarding rule on a frontend port already in use), so authoritative DNS
      # is published straight onto node addresses. These three IPs are what
      # ns1/ns2/ns3.dns.benebsworth.com resolve to; without this block the
      # Service disappears and the public nameservers stop answering.
      externalIPService:
        enabled: true
        addresses:
          - 149.28.170.95
          - 139.180.160.11
          - 207.148.84.78
      nodePortService:
        # Mutually exclusive with externalIPService above (the chart enforces it).
        enabled: false
        nodePort: 30053
        externalTrafficPolicy: Cluster

  strategy: Rolling
  syncPolicy: Auto
  syncOptions:
    prune: true

  stages:
    - name: vke-apps
      ring: 1
      autoPromote: true

  healthChecks:
    - name: control-health
      expression: http.statusCode == 200
      interval: 30s
      httpProbe:
        method: GET
        url: http://dns-control.dns.svc.cluster.local:8080/readyz
        timeout: 5
    - name: authority-health
      expression: http.statusCode == 200
      interval: 30s
      httpProbe:
        method: GET
        url: http://dns-authority-health.dns.svc.cluster.local:8080/readyz
        timeout: 5

  onFailure:
    action: rollback

  selfHeal:
    autoSyncOnDrift: true
    autoRevertOnHealthFailure: true
    cooldown: 5m
