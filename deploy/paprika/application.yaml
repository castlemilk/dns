# Bootstrap once with:
#   kubectl apply -f deploy/paprika/application.yaml
#
# BLOCKED BY DESIGN: replace the git revision and both sha256 image digests
# before applying. The placeholder digests fail the chart schema, so Paprika
# cannot deploy mutable or guessed images. The dns-auth Secret must already
# contain independent api-bearer-token and snapshot-bearer-token keys; never
# add token data here.
#
# ONE DOMAIN. Every public name this deployment answers on — console, snapshot
# feed, certificate names, Stripe return origin, mail host, and the delegated
# nameservers — derives from domain.base in the values below. Moving to a new
# zone is one edit. The keys that used to spell those names out are still here,
# emptied, because empty is how the chart is asked to derive: an explicit value
# always wins, so any one left set would silently pin that single name to the
# old zone while the other five moved. The one hostname deliberately still
# spelled out is platform.hosting.gatewayHostname; the comment at that value
# says why, and getting it wrong breaks hosting silently.
apiVersion: v1
kind: Namespace
metadata:
  name: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: core.paprika.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
spec:
  description: DNS workloads from the castlemilk/dns repository
  sourceRepos:
    - https://github.com/castlemilk/dns.git
  destinations:
    - server: "*"
      namespace: dns
  kinds:
    - ConfigMap
    - Deployment
    - StatefulSet
    - Service
    - PersistentVolumeClaim
    - PodDisruptionBudget
    - NetworkPolicy
    - HTTPRoute
    - Certificate
    - ReferenceGrant
    # Paprika resolves these CRD GVKs through API discovery using the apiVersion
    # rendered by the chart; the project allow-list itself is kind-based.
    - ServiceMonitor
    - PrometheusRule
---
apiVersion: pipelines.paprika.io/v1alpha1
kind: Application
metadata:
  name: dns
  namespace: dns
  labels:
    app.kubernetes.io/name: dns
    app.kubernetes.io/part-of: dns
spec:
  project: default
  parameters:
    # Paprika otherwise injects dns-release, which would change every rendered
    # Service name and break the stable in-cluster health-check URL below.
    release-name: dns
  source:
    type: git
    repoUrl: https://github.com/castlemilk/dns.git
    # Replace with the full 40-character commit SHA containing the chart and
    # exactly matching the image provenance labels/digests below.
    revision: REPLACE_WITH_FULL_40_CHARACTER_GIT_SHA
    path: charts/dns
    targetNamespace: dns
    pollInterval: 60s
    valuesFile: |
      production: true
      # THE LEVER. base is the only value here that changes when this platform
      # moves zone; service and nameserverCount describe the shape inside
      # whatever zone that is, and stay put. What they produce today:
      #   console / Connect API   deephost.benebsworth.com
      #   snapshot feed           snapshot.deephost.benebsworth.com
      #   certificate             both of the names above
      #   Stripe return origin    https://deephost.benebsworth.com
      #   mail host (once on)     mail.deephost.benebsworth.com
      #   delegation              ns1.deephost.benebsworth.com, ns2.deephost.benebsworth.com
      domain:
        base: benebsworth.com
        # Pinned rather than inherited, both of these: they decide what every
        # served zone publishes in its NS records and what name the certificate
        # is issued for, and neither should move because a chart default did.
        #
        # "deep", not the chart's "dns" default. That default is an artefact of
        # the repository, module and namespace all being called dns; it named
        # the platform after its first component. Nothing derives from it but
        # the label, so the platform sits at deep.<base> and the DNS service is
        # one thing it offers rather than the thing it is called.
        service: deephost
        # Two is what is delegated today — ns1 and ns2, per
        # docs/production-launch.md. A third derived name would be a promise
        # that ns3.deephost.benebsworth.com resolves, and every resolver that
        # believed it would pay a timeout; raise this only after that A record
        # exists. The chart also refuses a count larger than the number of
        # externalIPService.addresses published at the bottom of this file.
        nameserverCount: 2
      images:
        server:
          tag: ""
          digest: sha256:REPLACE_WITH_64_HEX_SERVER_DIGEST
        web:
          tag: ""
          digest: sha256:REPLACE_WITH_64_HEX_WEB_DIGEST
      auth:
        existingSecret: dns-auth
        apiBearerTokenKey: api-bearer-token
        snapshotBearerTokenKey: snapshot-bearer-token
      # The hosting engine. extraEnv deliberately cannot carry HOSTING_* — the
      # chart schema forbids that prefix so engine configuration goes through
      # this typed block instead, where the values are validated. The token is a
      # Secret reference and never a literal: create dns-hosting-engine in the
      # dns namespace with an api-token key holding a DeepHost control-plane
      # token, exactly as the dns-auth Secret is created out of band. With
      # enabled false the facade reports hosting as not configured and the
      # console degrades to DNS only, which is the honest default.
      platform:
        # Mail is staged but OFF, and turning it on needs two things this
        # cluster does not have yet:
        #   1. Block storage. The account is at its Vultr subscription limit —
        #      dns-authority-1 and -2 have been Pending on exactly that — and the
        #      mail StatefulSet claims a volume, so it would land the same way.
        #   2. A dns-mail-engine Secret holding the admin token, created out of
        #      band like dns-auth. The chart refuses to render without it rather
        #      than emitting an empty Secret reference.
        # Beyond the cluster: outbound 25 is blocked by many providers, the MX
        # records must delegate to the published node addresses, and submission
        # and POP3S need a certificate before either listener starts.
        mail:
          # Still off — the Secret below now exists, but three things outside
          # this cluster do not yet: MX delegation to the published node
          # addresses, a certificate for the mail host (without one maild
          # disables the implicit-TLS listeners), and confirmation that Vultr
          # permits outbound 25 from these nodes. Flip enabled to true on both
          # this block and the mail component once those are true.
          #
          # There is no hostname key here: it derives as
          # mail.<domain.service>.<domain.base>, mail.deephost.benebsworth.com
          # today. That name is deliberately NOT in the certificate the chart
          # requests — see tls.dnsNames below.
          enabled: false
          existingSecret: dns-mail-engine
          apiTokenKey: api-token
        billing:
          # The secret below holds a Stripe SANDBOX key (test mode), created
          # with `stripe sandbox create` so nothing touches the live Gamma
          # Systems account. The sandbox expires 2026-09-15 unless claimed. It
          # is useful for a non-production deployment; it cannot be used here.
          #
          # provider is "" — billing is DISABLED — and a sandbox key cannot
          # change that. This deployment runs DNS_PRODUCTION=true, and the
          # control plane refuses a test key in production
          # (internal/config/engines.go): a sandbox moves no money, so billing
          # real customers against it would take payment that never arrives.
          # Turning this on needs a LIVE restricted key from the real account,
          # not the sandbox below.
          #
          # Two things must also be true first, independent of the key:
          #
          #  1. Stripe delivers webhooks to a public HTTPS URL, and
          #     deephost.benebsworth.com must answer from the internet. The
          #     certificate is not evidence of that — cert-manager used a dns01
          #     challenge, which never needed reachability. With billing on and
          #     webhooks undeliverable a checkout succeeds and the subscription
          #     never activates: a silent failure, exactly what the Stripe
          #     guidance warns about.
          #  2. The price is a PLACEHOLDER (A$10.00/month, tagged
          #     placeholder=true in Stripe metadata). Set the real one first.
          #
          # Enabling this without (1) and (2) charges people incorrectly, so it
          # is a deliberate decision, not a config toggle.
          provider: ""
          # Empty derives https://<the console host>, https://deephost.benebsworth.com
          # today. This is the origin Stripe returns a customer to and the one
          # its webhooks are posted at, so it has to be the same host the
          # HTTPRoute claims and the certificate covers — deriving it is what
          # makes that true by construction instead of by inspection. Set it
          # explicitly only for something the derivation cannot express: a
          # non-standard port, or a separate billing origin.
          publicUrl: ""
          customerEmail: ben.ebsworth@gmail.com
          existingSecret: dns-billing-engine
          secretKeyKey: stripe-secret-key
          webhookSecretKey: stripe-webhook-secret
          priceIdKey: stripe-price-id
          webhookRoute:
            # Stripe posts the raw path, not a Connect RPC path, so it needs its
            # own rule — without it the POST lands on the console and 404s.
            # Off while provider is "": the chart refuses the pair, because a
            # webhook route with no billing engine behind it is a public
            # endpoint that accepts Stripe POSTs and does nothing with them.
            enabled: false
        hosting:
          enabled: true
          apiUrl: http://deephost-controlplane.deephost.svc.cluster.local:8080
          # STAYS EXPLICIT, and must not be folded into domain.base. This names
          # DeepHost's ingress, not this platform's: it is where attached
          # customer apexes are pointed with an A/ALIAS record. It sits under
          # benebsworth.com today only because one operator happens to run both
          # systems, and DeepHost can be moved to any zone without this chart
          # being involved. Derive it and a domain.base change would repoint
          # every attached customer apex at a host that does not exist — which
          # renders cleanly, deploys cleanly, and surfaces as customer sites
          # going dark. It changes when DeepHost changes, by hand, here.
          gatewayHostname: apps.deephost.benebsworth.com
          existingSecret: dns-hosting-engine
          apiTokenKey: api-token
      control:
        # Permit zone-file imports up to the aggregate publication ceiling.
        httpMaxBodyBytes: 8388608
        # Empty asks for the derived delegation: ns1.deephost.benebsworth.com and
        # ns2.deephost.benebsworth.com, from the domain block above.
        #
        # The key cannot simply be deleted. The chart's own default for it is
        # two ns<N>.example.net placeholders, and an explicit list always wins
        # over the derivation, so a missing key here would publish example.net
        # in the NS records of every zone served. [] is the opt-in; the chart
        # refuses the deleted-key case by name rather than letting it out.
        nameservers: []
        persistence:
          # The cluster default deletes its Vultr volume when the PVC is
          # removed. Retain protects the backing volume from Paprika pruning.
          storageClass: vultr-block-storage-retain
      authority:
        replicaCount: 3
        snapshot:
          pollInterval: 5s
          # Keep the last checksum-valid snapshot serving through a control
          # outage; readiness degrades only after a full day without refresh.
          maxStaleness: 24h
          httpTimeout: 5s
          # Bounds control admission and authority download/compile together.
          # Raise only after heap benchmarks and resource limits are reviewed.
          maxBodyBytes: 8388608
        cache:
          # Ephemeral snapshot cache, on purpose. The Vultr account is at its
          # block-storage SUBSCRIPTION cap (a count limit, 10 of 10), and the
          # third authority's 1Gi claim sat Pending behind it for two days.
          # Three 1Gi caches were consuming three of the ten slots to hold a
          # file that is a recovery copy, not serving state.
          #
          # What this gives up: a restarted authority can no longer serve from
          # its own last-known snapshot while the control plane is unreachable;
          # it must reach control first. Nothing on the query path changes — a
          # query reads an in-memory pointer and never touches the cache file.
          # Bounded by three replicas behind a minAvailable=2 PDB, which do not
          # restart together. Revert both lines once the cap is raised.
          acknowledgeEphemeralCache: true
          persistence:
            enabled: false
            storageClass: vultr-block-storage-retain
      observability:
        enabled: true
        environment: production
        collector:
          enabled: true
          # The immutable upstream multi-architecture 0.159.0 image index.
          image:
            tag: "0.159.0"
            digest: sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          serviceMonitor:
            # Kept for operator-compatible Prometheus installations. The
            # current deephost Prometheus uses endpoint-aware static discovery.
            enabled: true
          networkPolicy:
            enabled: true
            monitoringNamespaceSelector:
              kubernetes.io/metadata.name: deephost
            monitoringPodSelector:
              app: deephost-prometheus
        alerts:
          enabled: true
      httpRoute:
        enabled: true
        acknowledgePublicControlPlane: true
        parentRef:
          name: paprika
          namespace: envoy-gateway-system
          sectionName: https
        # Empty derives the single console host <domain.service>.<domain.base>,
        # the apex deephost.benebsworth.com. Deriving rather than naming it is
        # deliberate: this is the one value that would otherwise pin the console
        # to a zone the rest of the deployment had already left.
        #
        # The apex is this platform's to serve. Its "/" is the marketing landing
        # page and everything under it is the console, so one name covers both
        # jobs the DeepHost landing app and a separate console used to split.
        # List names here only to claim more than one; the first entry then
        # becomes the canonical origin everything else follows.
        hostnames: []
      dnsService:
        # Prefer an out-of-band LB with UDP+TCP rules on one stable address.
        enabled: false
        acknowledgeVultrSharedHealthCheckRisk: false
        # Both protocol Services share this Vultr LB label. Empty derives a
        # release-qualified label; on VKE, set an existing LB label to reuse
        # its stable address.
        sharedLoadBalancerLabel: ""
        udp:
          # Portable address hint; support depends on the Vultr CCM release.
          loadBalancerIP: ""
        tcp:
          # Keep this identical to UDP when the CCM honors address hints.
          loadBalancerIP: ""
      snapshotRoute:
        # This exact-path route still requires the distinct snapshot bearer
        # token; no Connect procedure or UI path is exposed on this hostname.
        enabled: true
        acknowledgePublicSnapshotFeed: true
        # Empty derives snapshot.<domain.service>.<domain.base>,
        # snapshot.deephost.benebsworth.com today.
        hostname: ""
      tls:
        enabled: true
        clusterIssuer: letsencrypt-prod-dns
        secretName: dns-tls
        # Empty derives exactly the two names this chart routes: the console
        # host and the snapshot host. That is the same pair spelled out here
        # before, and deriving it is what stops the certificate and the routes
        # drifting apart on a zone move — the failure that pair produces is a
        # cert for a name nothing serves, discovered at renewal.
        #
        # The mail host is deliberately absent and is not added automatically.
        # cert-manager fails an entire Order when any single name in it cannot
        # be validated, so listing mail.deephost.benebsworth.com before its A record
        # exists would take the console certificate down with it. Add it here
        # by hand, alongside the derived names, once that name resolves.
        dnsNames: []
        referenceGrant:
          enabled: true
          gatewayNamespace: envoy-gateway-system
      # The nameservers the delegation actually points at. A Vultr load balancer
      # cannot carry TCP and UDP 53 together (its API refuses a second
      # forwarding rule on a frontend port already in use), so authoritative DNS
      # is published straight onto node addresses. The derived nameserver names
      # resolve to addresses in this list, which is why the chart refuses a
      # domain.nameserverCount larger than the number of addresses here: every
      # name in the delegation has to have somewhere to answer from. Without
      # this block the Service disappears and the public nameservers stop
      # answering.
      externalIPService:
        enabled: true
        addresses:
          - 149.28.170.95
          - 139.180.160.11
          - 207.148.84.78
      nodePortService:
        # Mutually exclusive with externalIPService above (the chart enforces it).
        enabled: false
        nodePort: 30053
        externalTrafficPolicy: Cluster

  strategy: Rolling
  syncPolicy: Auto
  syncOptions:
    prune: true

  stages:
    - name: vke-apps
      ring: 1
      autoPromote: true

  healthChecks:
    - name: control-health
      expression: http.statusCode == 200
      interval: 30s
      httpProbe:
        method: GET
        url: http://dns-control.dns.svc.cluster.local:8080/readyz
        timeout: 5
    - name: authority-health
      expression: http.statusCode == 200
      interval: 30s
      httpProbe:
        method: GET
        url: http://dns-authority-health.dns.svc.cluster.local:8080/readyz
        timeout: 5

  onFailure:
    action: rollback

  selfHeal:
    autoSyncOnDrift: true
    autoRevertOnHealthFailure: true
    cooldown: 5m
