syntax = "proto3";

package billing.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/platform.proto";

service BillingService {
  rpc GetBillingStatus(GetBillingStatusRequest) returns (GetBillingStatusResponse) {}
  rpc GetBillingSummary(GetBillingSummaryRequest) returns (GetBillingSummaryResponse) {}
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {}
  rpc ConfirmCheckout(ConfirmCheckoutRequest) returns (ConfirmCheckoutResponse) {}
  rpc CreatePortalSession(CreatePortalSessionRequest) returns (CreatePortalSessionResponse) {}
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {}
  // Re-queues dead-lettered webhook events (operator action; §6.4).
  rpc RetryDeadWebhooks(RetryDeadWebhooksRequest) returns (RetryDeadWebhooksResponse) {}
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_UNBILLED = 1;     // no subscription for this zone
  SUBSCRIPTION_STATE_PENDING = 2;      // checkout session open, not completed
  SUBSCRIPTION_STATE_ACTIVE = 3;
  SUBSCRIPTION_STATE_TRIALING = 4;
  SUBSCRIPTION_STATE_PAST_DUE = 5;
  SUBSCRIPTION_STATE_CANCELING = 6;    // cancel_at set, still active
  SUBSCRIPTION_STATE_CANCELED = 7;
  SUBSCRIPTION_STATE_INCOMPLETE = 8;   // incomplete | incomplete_expired | unpaid | paused
}

message Price {
  string id = 1;
  int64 unit_amount = 2;               // minor units (600)
  string currency = 3;                 // "usd"
  string interval = 4;                 // "month"
  string label = 5;                    // "$6 / domain / month" formatted server-side
}

message PaymentMethod {
  string brand = 1;
  string last4 = 2;
  uint32 exp_month = 3;
  uint32 exp_year = 4;
}

message DomainBilling {
  string zone_id = 1;
  string zone_name = 2;
  SubscriptionState state = 3;
  string subscription_id = 4;
  google.protobuf.Timestamp current_period_end = 5;
  google.protobuf.Timestamp cancel_at = 6;
  google.protobuf.Timestamp updated_at = 7;   // last event/confirm/reconcile that changed this row
  string last_event_id = 8;
  string last_invoice_status = 9;             // "paid" | "open" | "failed" | ""
  string checkout_session_id = 10;            // while PENDING
  google.protobuf.Timestamp checkout_expires_at = 11;
  bool zone_missing = 12;                     // zone deleted; row kept so the operator can cancel in the portal
}

message GetBillingStatusRequest {}

message GetBillingStatusResponse {
  platform.v1.EngineStatus engine = 1;
  string provider = 2;                 // "stripe" | "fake" | ""
  bool livemode = 3;
  Price price = 4;                     // unset when not configured or unreachable
  bool informational_only = 5;         // always true in this release
  string policy_note = 6;              // copy §6.6
  bool webhook_configured = 7;
  google.protobuf.Timestamp last_webhook_at = 8;
  uint32 pending_webhooks = 9;
  uint32 dead_webhooks = 10;           // dead-lettered events awaiting RetryDeadWebhooks
  google.protobuf.Timestamp reconciled_at = 11;  // last billing reconcile pass (§6.5)
  uint32 webhook_secrets = 12;         // number of configured signing secrets (rotation window)
}

message GetBillingSummaryRequest {}

message GetBillingSummaryResponse {
  repeated DomainBilling domains = 1;   // one row per zone, UNBILLED rows included
  bool customer_exists = 2;
  PaymentMethod payment_method = 3;     // unset when unknown
  uint32 active_count = 4;
  uint32 attention_count = 5;           // PAST_DUE + INCOMPLETE
}

message CreateCheckoutSessionRequest {
  string zone_id = 1;
  string return_path = 2;               // "/billing" (default) or "/domains/<zone>"; must start with "/"
}

message CreateCheckoutSessionResponse {
  string url = 1;
  string session_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmCheckoutRequest {
  string session_id = 1;                // from /billing/success?session_id=; must be a session this control plane created
}

message ConfirmCheckoutResponse {
  DomainBilling domain = 1;
  bool completed = 2;
  string provider = 3;                  // "stripe" | "fake"
  bool payment_required = 4;            // false when payment_status == no_payment_required
}

message CreatePortalSessionRequest {
  string flow = 1;                      // "" | "payment_method_update" | "subscription_cancel"
  string zone_id = 2;                   // required for subscription_cancel
  string return_path = 3;
}

message CreatePortalSessionResponse {
  string url = 1;
}

message Invoice {
  string id = 1;
  string number = 2;
  string zone_name = 3;                 // parent.subscription_details.metadata.domain
  google.protobuf.Timestamp created_at = 4;
  int64 total = 5;                      // minor units
  string currency = 6;
  string status = 7;                    // "draft" | "open" | "paid" | "void" | "uncollectible"
  string hosted_invoice_url = 8;        // rendered as a link only when it parses as https (fake: loopback http)
  string invoice_pdf_url = 9;
}

message ListInvoicesRequest {
  uint32 limit = 1;                     // default 25, max 100
  string cursor = 2;                    // starting_after; must match ^in_[A-Za-z0-9]{8,}$
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  string next_cursor = 2;
  bool live = 3;                        // false = provider unreachable, list empty
}

message RetryDeadWebhooksRequest {}

message RetryDeadWebhooksResponse {
  uint32 requeued = 1;
}
