syntax = "proto3";

package mail.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/platform.proto";

service MailService {
  rpc GetMailStatus(GetMailStatusRequest) returns (GetMailStatusResponse) {}
  rpc ListMailDomains(ListMailDomainsRequest) returns (ListMailDomainsResponse) {}
  rpc GetMailDomain(GetMailDomainRequest) returns (GetMailDomainResponse) {}
  rpc BindMailDomain(BindMailDomainRequest) returns (BindMailDomainResponse) {}
  rpc UpdateMailDomain(UpdateMailDomainRequest) returns (UpdateMailDomainResponse) {}
  rpc UnbindMailDomain(UnbindMailDomainRequest) returns (UnbindMailDomainResponse) {}
  rpc ReapplyMailDns(ReapplyMailDnsRequest) returns (ReapplyMailDnsResponse) {}
  rpc ListMailboxes(ListMailboxesRequest) returns (ListMailboxesResponse) {}
  rpc CreateMailbox(CreateMailboxRequest) returns (CreateMailboxResponse) {}
  rpc UpdateMailbox(UpdateMailboxRequest) returns (UpdateMailboxResponse) {}
  rpc ResetMailboxPassword(ResetMailboxPasswordRequest) returns (ResetMailboxPasswordResponse) {}
  rpc DeleteMailbox(DeleteMailboxRequest) returns (DeleteMailboxResponse) {}
  rpc ListForwarders(ListForwardersRequest) returns (ListForwardersResponse) {}
  rpc CreateForwarder(CreateForwarderRequest) returns (CreateForwarderResponse) {}
  rpc DeleteForwarder(DeleteForwarderRequest) returns (DeleteForwarderResponse) {}
  rpc GetMailQueue(GetMailQueueRequest) returns (GetMailQueueResponse) {}
}

enum MailDomainState {
  MAIL_DOMAIN_STATE_UNSPECIFIED = 0;
  MAIL_DOMAIN_STATE_BINDING = 1;    // row persisted before any engine/DNS write; the reconciler finishes an interrupted bind
  MAIL_DOMAIN_STATE_BOUND = 2;
  MAIL_DOMAIN_STATE_DEGRADED = 3;   // reconciler found drift it could not fix, DKIM keys still generating, hostname changed, or zone missing (reason)
  MAIL_DOMAIN_STATE_UNBINDING = 4;
}

message DkimKey {
  string selector = 1;       // "v1-rsa-20260903"
  string algorithm = 2;      // "Dkim1RsaSha256" | "Dkim1Ed25519Sha256" | ...
  string stage = 3;          // "pending" | "active" | "retiring" | "retired"
  bool published = 4;        // matching TXT present in our zone
  google.protobuf.Timestamp created_at = 5;
}

message MailRecord {
  string name = 1;           // "@", "_dmarc", "<sel>._domainkey", "_imaps._tcp", "autoconfig"
  string type = 2;           // "MX" | "TXT" | "SRV" | "CNAME" (SRV/CNAME only for the §G4 client-autoconfiguration records)
  string value = 3;          // stored form
  uint32 ttl = 4;
  string record_id = 5;      // "" when missing from the zone
  bool present = 6;
  bool matches = 7;          // present && value equal (TXT compared by unquoted concatenated text, §3.4)
}

message MailDomain {
  string zone_id = 1;
  string zone_name = 2;
  string engine_domain_id = 3;
  MailDomainState state = 4;
  string reason = 5;
  string mail_hostname = 6;          // MAIL_HOSTNAME
  string dmarc_policy = 7;           // "none" | "quarantine" | "reject"
  string report_address = 8;         // rua target: MAIL_REPORT_ADDRESS or postmaster@<zone>
  repeated DkimKey dkim = 9;
  repeated MailRecord records = 10;  // the exact engine-owned record set with its DNS state
  bool records_in_sync = 11;
  uint32 mailbox_count = 12;
  uint32 mailbox_limit = 13;
  uint64 used_bytes = 14;            // sum of usedDiskQuota, live
  uint32 forwarder_count = 15;
  bool has_postmaster = 16;          // postmaster@<zone> exists as mailbox, alias or forwarder
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp reconciled_at = 18;
  bool dkim_pending = 19;            // fewer active DKIM keys than requested algorithms; the reconciler re-reads them
  bool zone_missing = 20;            // the zone was deleted or restored away; only Unbind is offered

  // publish_client_autoconfig reports whether the client-autoconfiguration
  // records (§G4) are part of this binding's published set. It is on for a
  // binding created with the default and off for every binding made before the
  // records existed, so nothing was ever added under a running deployment.
  bool publish_client_autoconfig = 21;

  // delivery is the rolling delivered/bounced count for this domain. It is
  // absent unless MAIL_WEBHOOK_SECRET is set AND the mail server has been
  // configured to post its delivery events here; there is no other source for
  // it on the community edition, and no figure is ever estimated.
  DeliveryStats delivery = 22;

  // counts_available reports whether mailbox_count, used_bytes,
  // forwarder_count and has_postmaster were actually read from the mail
  // server. They are plain proto3 scalars, so a failed read puts 0 and false on
  // the wire and nothing else distinguishes that from a domain with no
  // mailboxes and no postmaster. When this is false the console must say the
  // figures are unknown — `reason` carries the sentence — and must not sum
  // them, show "0 mailboxes", or warn that a postmaster is missing.
  bool counts_available = 23;
}

// DeliveryStats is what the mail server's own delivery events said, counted per
// bound domain over a rolling window of whole hours.
//
// available is false whenever the number would be a guess: no receiver is
// configured, or the receiver has not been running for the whole window yet. A
// false here means the console must say so, never show a zero.
message DeliveryStats {
  bool available = 1;
  uint32 delivered = 2;               // delivery.dsn-success events for this domain
  uint32 bounced = 3;                 // delivery.dsn-perm-fail events for this domain
  uint32 window_hours = 4;            // the width of the window these counts cover
  google.protobuf.Timestamp since = 5;        // the start of the counted window
  google.protobuf.Timestamp observed_at = 6;  // the newest event counted
}

message QueueSummary {
  bool available = 1;                // false when the engine errored or the 500-message page was full (attribution incomplete)
  uint32 scheduled = 2;
  uint32 failing = 3;                // TemporaryFailure
  uint32 failed = 4;                 // PermanentFailure still listed
  google.protobuf.Timestamp observed_at = 5;
}

message GetMailStatusRequest {}

message GetMailStatusResponse {
  platform.v1.EngineStatus engine = 1;
  string mail_hostname = 2;
  string edition = 3;                       // "community" | "enterprise" | ""
  repeated string missing_permissions = 4;  // sys* names the key lacks
  uint32 mailboxes_per_domain = 5;
  bool delivery_stats_available = 6;        // true only when a delivery-event receiver is configured
  string delivery_stats_note = 7;           // copy §5.6
  uint32 domains = 8;
  uint32 mailboxes = 9;
  uint64 used_bytes = 10;
  uint32 delivery_window_hours = 11;        // the width of the rolling window, 0 when unavailable

  // counts_available reports whether mailboxes and used_bytes are the totals
  // across every bound domain. It is false when the engine is not configured,
  // or when one per-domain read failed and the sums are therefore partial: the
  // fields are proto3 scalars, so a partial sum is indistinguishable from a
  // complete one on the wire. When false the console must not present them as
  // platform totals.
  bool counts_available = 12;

  // receiver_last_event_at is when this control plane last accepted a delivery
  // event from the mail server. It is absent until one arrives. A receiver that
  // worked and then stopped — the server restarted without the webhook, or its
  // URL changed — keeps delivery_stats_available true and drifts to zeroes over
  // the window, and this is the only field that shows it: an operator can see
  // that nothing has been posted for hours while counts are still being claimed.
  google.protobuf.Timestamp receiver_last_event_at = 13;
}

message ListMailDomainsRequest {}

message ListMailDomainsResponse {
  repeated MailDomain domains = 1;
}

message GetMailDomainRequest {
  string zone_id = 1;
}

message GetMailDomainResponse {
  MailDomain domain = 1;
  QueueSummary queue = 2;
}

message BindMailDomainRequest {
  string zone_id = 1;
  string dmarc_policy = 2;               // "" = MAIL_DMARC_POLICY
  bool replace_conflicting_records = 3;
  bool dry_run = 4;

  // publish_client_autoconfig also publishes the client-autoconfiguration
  // records the mail server's zone file offers (the _tcp SRV records and the
  // autoconfig/autodiscover aliases). It is optional and ABSENT MEANS ON: a new
  // binding gets them, and an older client that does not send the field still
  // gets the current default rather than an accidental opt-out.
  optional bool publish_client_autoconfig = 5;
}

message BindMailDomainResponse {
  MailDomain domain = 1;
  repeated platform.v1.RecordChange dns_plan = 2;
  repeated platform.v1.RecordChange conflicts = 3;
  bool dry_run = 4;
}

message UpdateMailDomainRequest {
  string zone_id = 1;
  optional string dmarc_policy = 2;

  // publish_client_autoconfig turns the client-autoconfiguration records on or
  // off for an existing binding. Absent leaves it as it is, so an existing
  // binding never changes underneath its owner.
  optional bool publish_client_autoconfig = 3;
}

message UpdateMailDomainResponse {
  MailDomain domain = 1;
  repeated platform.v1.RecordChange dns_plan = 2;
}

message UnbindMailDomainRequest {
  string zone_id = 1;
  bool delete_mailboxes = 2;     // required true when mailboxes or forwarders exist
  bool keep_dns_records = 3;     // re-source engine records as user records instead of deleting them
  string confirm_zone_name = 4;  // must equal the zone name when delete_mailboxes is true
}

message UnbindMailDomainResponse {
  uint32 mailboxes_deleted = 1;
  uint32 forwarders_deleted = 2;
}

message ReapplyMailDnsRequest {
  string zone_id = 1;
  bool replace_conflicting_records = 2;
  bool dry_run = 3;
}

message ReapplyMailDnsResponse {
  MailDomain domain = 1;
  repeated platform.v1.RecordChange dns_plan = 2;
  repeated platform.v1.RecordChange conflicts = 3;
  bool dry_run = 4;
}

message Mailbox {
  string id = 1;                 // Stalwart account id
  string zone_id = 2;
  string address = 3;            // local@zone
  string local_part = 4;
  string display_name = 5;
  uint64 quota_bytes = 6;        // maxDiskQuota (0 = unlimited; never written by us)
  uint64 used_bytes = 7;
  repeated string aliases = 8;   // local parts that deliver here
  google.protobuf.Timestamp created_at = 9;
}

message ListMailboxesRequest {
  string zone_id = 1;
}

message ListMailboxesResponse {
  repeated Mailbox mailboxes = 1;
  uint32 limit = 2;
}

message CreateMailboxRequest {
  string zone_id = 1;
  string local_part = 2;         // validated §5.4
  string display_name = 3;       // <= 80 runes
  uint64 quota_bytes = 4;        // 0 → MAIL_DEFAULT_QUOTA_BYTES
}

message CreateMailboxResponse {
  // How a client actually reaches this mailbox. The retrieval fields used to be
  // imap_host/imap_port fixed at 993, which described Stalwart's defaults rather
  // than the engine in front of us: a deployment whose engine speaks POP3 and no
  // IMAP told its users to configure a port nothing listens on. They are now
  // derived from the client-autoconfiguration records the engine itself
  // advertises, so an engine that offers neither says so by leaving them empty.
  reserved 3, 4;
  reserved "imap_host", "imap_port";

  Mailbox mailbox = 1;
  string password = 2;           // generated; shown once; never stored, logged or recorded by the facade
  string smtp_host = 5;
  uint32 smtp_port = 6;          // submission, from _submissions._tcp
  string retrieval_protocol = 7; // "imaps" | "pop3s"; empty when the engine advertises neither
  string retrieval_host = 8;
  uint32 retrieval_port = 9;
}

message UpdateMailboxRequest {
  string zone_id = 1;
  string mailbox_id = 2;
  optional string display_name = 3;
  optional uint64 quota_bytes = 4;
}

message UpdateMailboxResponse {
  Mailbox mailbox = 1;
}

message ResetMailboxPasswordRequest {
  string zone_id = 1;
  string mailbox_id = 2;
}

message ResetMailboxPasswordResponse {
  string password = 1;
}

message DeleteMailboxRequest {
  string zone_id = 1;
  string mailbox_id = 2;
  string confirm_address = 3;    // must equal the mailbox address
}

message DeleteMailboxResponse {}

enum ForwarderKind {
  FORWARDER_KIND_UNSPECIFIED = 0;
  FORWARDER_KIND_ALIAS = 1;      // Account.aliases entry on a mailbox of this zone
  FORWARDER_KIND_LIST = 2;       // x:MailingList (one or more targets, any external)
}

message Forwarder {
  string id = 1;                 // "alias:<accountId>:<local>" | "list:<listId>"
  string zone_id = 2;
  string address = 3;            // local@zone
  string local_part = 4;
  ForwarderKind kind = 5;
  repeated string targets = 6;
  bool external = 7;             // any target outside this zone
}

message ListForwardersRequest {
  string zone_id = 1;
}

message ListForwardersResponse {
  repeated Forwarder forwarders = 1;
}

message CreateForwarderRequest {
  string zone_id = 1;
  string local_part = 2;
  repeated string targets = 3;   // 1..10 valid addresses
}

message CreateForwarderResponse {
  Forwarder forwarder = 1;
}

message DeleteForwarderRequest {
  string zone_id = 1;
  string forwarder_id = 2;
}

message DeleteForwarderResponse {}

message QueuedMessage {
  string id = 1;
  string from = 2;               // returnPath; domain only when outside this zone
  repeated string to = 3;        // recipient addresses (external targets of a forwarder are listed with their orcpt zone address)
  string status = 4;             // recipients[].status.@type: "Scheduled" | "TemporaryFailure" | "PermanentFailure" | "Completed"
  string queue = 5;              // recipients[].queueName ("local" | "remote")
  google.protobuf.Timestamp due_at = 6;   // recipients[].retryDue, else message nextRetry
  uint32 attempts = 7;           // recipients[].retryCount
}

message GetMailQueueRequest {
  string zone_id = 1;
}

message GetMailQueueResponse {
  QueueSummary summary = 1;
  repeated QueuedMessage messages = 2;   // <= 100
}
