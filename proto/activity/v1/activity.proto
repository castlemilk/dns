syntax = "proto3";

package activity.v1;

import "google/protobuf/timestamp.proto";

service ActivityService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARN = 2;
  SEVERITY_ERROR = 3;
}

message Event {
  string id = 1;                       // "<unixms:016x>-<seq:04x>"; lexicographic = chronological
  google.protobuf.Timestamp time = 2;
  string zone_id = 3;                  // "" for global events
  string zone_name = 4;
  string actor = 5;                    // "operator" | "hosting-engine" | "mail-engine" | "billing-webhook" | "reconciler" | "system"
  string kind = 6;                     // dotted kind from the §7.1 allowlist
  Severity severity = 7;
  string summary = 8;                  // <= 200 runes, human sentence
  map<string, string> details = 9;     // <= 20 keys, <= 512 bytes per value, no secrets by construction
  string correlation_id = 10;          // deploy id | stripe event id | "gw-<unixms>" | ""
}

message ListEventsRequest {
  string zone_id = 1;                  // "" = all zones
  repeated string kinds = 2;           // exact kinds, or prefixes ending with "." ("deploy.")
  google.protobuf.Timestamp since = 3;
  uint32 limit = 4;                    // default 50, max 200
  string cursor = 5;                   // event id to continue before (newest-first paging)
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
  uint64 total_retained = 3;
}

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}
